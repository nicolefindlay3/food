*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 100px}
.top{display:flex;align-items:center;justify-content:space-between}
h1{font-family:Georgia,serif;font-size:28px;margin:6px 0 2px}
.gear{background:var(--card);border:1px solid var(--line);border-radius:50%;width:40px;height:40px;font-size:18px;color:var(--ink)}
.sub{color:var(--mute);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0000000a}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}

.nav button b{display:block;font-size:20px}.nav button.on{color:var(--accent)}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:13px 16px;font-weight:700;width:100%;font-size:16px}
.btn.alt{background:var(--chip);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:8px 14px;border-radius:99px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);color:#fff;font-weight:700}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .n{flex:1;min-width:0}.row .n div{font-weight:600;overflow-wrap:anywhere}.row small{color:var(--mute)}

.q span{min-width:24px;text-align:center;font-weight:700}

input{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:6px 0 10px}
label{font-size:13px;color:var(--mute);font-weight:600}
.stepper{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.stepper button{width:44px;height:44px;border-radius:50%;border:0;background:var(--chip);color:var(--ink);font-size:22px}
.stepper span{font-size:22px;font-weight:700;min-width:30px;text-align:center}

.wrap{flex-wrap:wrap;overflow:visible}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.rec h3{margin:0 0 4px;font-family:Georgia,serif}.rec .m{font-size:13px;color:var(--mute)}.ok{color:var(--sage);font-weight:700}
.rec p{font-size:14px;margin:8px 0 10px;line-height:1.45}
.hint{font-size:13px;color:var(--sage);font-weight:600;margin-bottom:6px}
.two{display:flex;gap:8px}.two input{margin:0}.two button{width:auto;padding:0 18px}
#scan{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#scan video{flex:1;width:100%;object-fit:cover;min-height:0}
#scan .bar{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;text-align:center;font-size:14px}
#scan .frame{position:absolute;left:12%;right:12%;top:30%;height:22%;border:3px solid #fff8;border-radius:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;display:none;z-index:30;max-width:90%}

function setHH(){

function age(ts){const d=Math.floor((Date.now()-ts)/864e5);return d<1?"today":d<31?d+"d ago":Math.floor(d/30)+"mo ago"}

function addItem(name,loc,n,code,cat){

function setCat(id,c){const it=S.items.find(i=>i.id==id);if(!it)return;it.cat=c;put(it);render()}

  $("#nav").innerHTML=[["stock","🧊","Stock"],["add","➕","Add"],["recipes","🍳","Cook"]].map(([k,e,l])=>`<button class="${tab==k?"on":""}" onclick="go('${k}')"><b>${e}</b>${l}</button>`).join("");
  $("#app").innerHTML=tab=="stock"?vStock():tab=="add"?vAdd():vRec();

function go(t){tab=t;if(t=="add"&&!form)form={name:"",loc:"Pantry",n:1,code:"",hint:""};render();scrollTo(0,0)}
function vStock(){
  if(!S.items.length)return`<div class="empty">Nothing here yet.<br>Tap Add to scan or enter your first item.</div>`;

  const row=(arr,cur,v)=>`<div class="chips">${arr.map(l=>`<button class="chip ${cur==l?"on":""}" onclick="${v}='${l.replace(/'/g,"\\'")}';render()">${l}</button>`).join("")}</div>`;

  const it=S.items.find(i=>i.id==last);if(!it)return"";
  return`<div class="card" style="border-color:var(--sage)"><div class="hint">✓ Added</div><div class="row" style="border:0;padding:4px 0"><div class="n"><div>${esc(it.name)}</div><small>${it.loc} · ${catOf(it)}</small></div><div class="q"><button onclick="change('${it.id}',-1)">−</button><span>${it.qty}</span><button onclick="change('${it.id}',1)">+</button></div></div><button class="btn" style="margin-top:8px" onclick="startScan()">📷 Scan next</button></div>`}

  return lastCard()+`<button class="btn" onclick="startScan()">📷 Scan barcode</button>

/* Barcode lookup: your saved names first, then Open Food Facts */
async function off(code){
  try{const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+enc(code)+".json?fields=product_name");
    const j=await r.json();if(j.status==1&&j.product&&j.product.product_name)return j.product.product_name.trim()}catch(e){}

/* Scanner */
let stream=null,live=false;
const ZOPT={formats:["EAN-13","EAN-8","UPC-A","UPC-E","Code128"],tryHarder:true,maxNumberOfSymbols:1};

function loadZW(){return new Promise((res,rej)=>{if(window.ZXingWASM)return res();const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.1/dist/iife/reader/index.js";s.onload=res;s.onerror=()=>rej(new Error("Couldn't load the scanner — check your connection"));document.head.appendChild(s)})}

async function startScan(){
  $("#scan").style.display="flex";live=true;msg("Starting camera…");
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("This browser can't open the camera here. Use Safari or Chrome and the https address.");
    const ready=("BarcodeDetector" in window)?null:loadZW();
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
    const v=$("#vid");v.setAttribute("playsinline","");v.muted=true;v.srcObject=stream;await v.play();
    try{const t=stream.getVideoTracks()[0],c=t.getCapabilities&&t.getCapabilities();if(c&&c.focusMode&&c.focusMode.includes("continuous"))await t.applyConstraints({advanced:[{focusMode:"continuous"}]})}catch(e){}
    msg("Hold the barcode inside the box, steady, about 15–20cm away");
    if(!ready){
      const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});
      (async function loop(){if(!live)return;try{const r=await det.detect(v);if(r.length){found(r[0].rawValue);return}}catch(e){}setTimeout(loop,100)})();
    }else{
      await ready;
      const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
      let n=0;
      (async function loop(){
        if(!live)return;
        if(v.videoWidth){

const has=kw=>S.items.filter(i=>i.qty>0&&i.name.toLowerCase().includes(kw));
function vRec(){
  if(!S.items.length)return`<div class="empty">Add some food first and I'll suggest what to cook.</div>`;
  const out=R.map(r=>{let got=0,oldHit=0,miss=[],use=[];
    r[2].forEach(g=>{let f=null;for(const k of g){const m=has(k);if(m.length){f=m.sort((a,b)=>a.added-b.added)[0];break}}
      if(f){got++;use.push(f);if(old(f))oldHit++}else miss.push(g[0])});
    return{r,got,tot:r[2].length,oldHit,miss,use}}).filter(x=>x.got>=2&&x.got/x.tot>=.6)
    .sort((a,b)=>(b.got/b.tot)-(a.got/a.tot)||b.oldHit-a.oldHit||Math.min(...a.use.map(u=>u.added))-Math.min(...b.use.map(u=>u.added)));
  window._out=out;
  if(!out.length)return`<div class="empty">Nothing matches yet. Add more everyday ingredients.</div>`;
  return`<div class="sub">Ranked by what you can make now, then by how long ingredients have been waiting.</div>`+out.map((x,i)=>`<div class="card rec"><h3>${x.r[0]}</h3>
  <div class="m">${x.r[1]} · <span class="ok">${x.got}/${x.tot} ingredients</span>${x.oldHit?` · uses ${x.oldHit} older item${x.oldHit>1?"s":""}`:""}</div>
  <p>${x.r[3]}</p><div class="m">Using: ${x.use.map(u=>esc(u.name)).join(", ")}${x.miss.length?"<br>Missing: "+x.miss.join(", "):""}</div>
  <button class="btn alt" style="margin-top:10px" onclick="cooked(${i})">I cooked this — use 1 of each</button></div>`).join("");
}
function cooked(i){const x=window._out[i];if(!x)return;x.use.forEach(u=>change(u.id,-1,1));toast("Nice — stock updated");render()}
render();pull();
setInterval(pull,20000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
